<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor-principal">
        <h2>Registro de Usuario</h2>
        <form id="formulario">

            <div class="campo-item">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
            </div>

            <div class="campo-item">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required>
            </div>

            <div class="campo-item">
                <label for="tipoDoc">Tipo Doc</label>
                <select id="tipoDoc" name="tipoDoc" required>
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="CC">Cédula de Ciudadanía (CC)</option>
                    <option value="TI">Tarjeta de Identidad (TI)</option>
                    <option value="CE">Cédula de Extranjería (CE)</option>
                    <option value="PPT">Permiso por Protección Temporal (PPT)</option>
                    <option value="PAS">Pasaporte (PAS)</option>
                    <option value="RC">Registro Civil (RC)</option>
                    <option value="PEP">Permiso Especial de Permanencia (PEP)</option>
                    <option value="NIT">Número de Identificación Tributaria (NIT)</option>
                </select>
            </div>

            <div class="campo-item">
                <label for="dni">DNI</label>
                <input type="text" id="dni" name="dni" placeholder="Número de documento" required>
            </div>

            <div class="campo-item">
                <label for="fechaNacimiento">Fecha Nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="campo-item">
                <label for="telefono">Número de teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
            </div>

            <div class="campo-item">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="campo-item">
                <label for="pais">País Domicilio</label>
                <input type="text" id="pais" name="pais" placeholder="Colombia" required>
            </div>

            <div class="campo-item">
                <label for="ciudad">Ciudad Domicilio</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" required>
            </div>

            <div class="campo-checkbox">
                <input type="checkbox" id="tratamientoDatos" name="tratamientoDatos" required>
                <label for="tratamientoDatos">Acepto el tratamiento de datos personales</label>
            </div>

            <button type="submit" class="btn-enviar">Enviar Datos</button>

        </form>
    </div>
</body>
</html>
